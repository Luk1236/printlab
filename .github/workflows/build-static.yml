name: Build static frontend

# Baut die Oberfläche (frontend/) und legt das Ergebnis in static/ ab, das der Pi und jede Installation ohne Node
# ausliefert. Läuft automatisch, sobald auf dem Branch bambu-monitor-port etwas an der Oberfläche geändert wird, und
# kann von Hand gestartet werden (Actions -> Build static frontend -> Run workflow).
# Das Ergebnis wird als eigener Commit eingecheckt (der Bot-Commit löst diesen Workflow nicht erneut aus), dazu die
# Prüfsumme der Quellen in static/BUILD_SOURCE_SHA; der Release-Prüfer vergleicht sie beim Setzen eines Tags.
# Nach einem Push erst den Bot-Commit abwarten (git pull), dann taggen.

on:
  workflow_dispatch:
  push:
    branches: [bambu-monitor-port]
    paths:
      - "frontend/src/**"
      - "!frontend/src/__tests__/**"
      - "frontend/public/**"
      - "frontend/index.html"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vite.config.ts"
      - "frontend/postcss.config.js"
      - "frontend/tsconfig*.json"

permissions:
  contents: write

concurrency:
  group: build-static
  cancel-in-progress: false

jobs:
  build:
    name: Build and commit static/
    if: github.ref_type == 'branch' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Record the source hash
        run: python3 werkzeuge/release_pruefen.py --write-static-hash

      - name: Commit the new build
        run: |
          if [ -z "$(git status --porcelain static)" ]; then
            echo "static/ ist bereits aktuell."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static
          git commit -m "Rebuild static frontend"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
